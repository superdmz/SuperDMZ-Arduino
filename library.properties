name=SuperDMZ
version=1.2.0
author=SuperDMZ Team <support@superdmz.com>
maintainer=SuperDMZ Team <support@superdmz.com>
sentence=Secure reverse tunnel for ESP32 - expose your IoT WebServer at https://your-host.dmzgate.com without a public IP or router port forwarding.
paragraph=Connects the ESP32 to a SuperDMZ relay node over WSS (WebSocket TLS) and forwards incoming requests to the WebServer running on the ESP itself. Compatible with ESPAsyncWebServer, WebServer.h or any local TCP service. Includes ping/pong, auto-reconnect, and an optional provisioning captive portal.
category=Communication
url=https://github.com/superdmz/SuperDMZ-Arduino
architectures=esp32
includes=SuperDMZ.h
depends=WebSockets,ArduinoJson
